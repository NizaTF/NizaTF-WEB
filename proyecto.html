<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Proyecto · Nico Talens</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function() {
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('theme'); } catch {}
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (savedTheme === 'light' || (!savedTheme && systemPrefersLight)) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="icon" type="image/png" href="assets/img/favicon_oscuro.png" id="dynamic-favicon">
</head>

<body>
  <div id="scroll-progress"></div>

  <nav class="navbar">
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="sobre-mi.html">Sobre mí</a>
      <a href="proyectos.html" class="active">Proyectos</a>
      <a href="habilidades.html">Habilidades</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema"></button>
  </nav>

  <main id="blog-container">
    <p style="text-align: center; padding: clamp(48px, 12vw, 100px) 20px; color: var(--text-muted); font-family: var(--font-mono);">Cargando proyecto...</p>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>© 2026 · Nico Talens · <a href="admin.html" style="color: inherit; text-decoration: none; cursor: default;">Hecho con HTML &amp; CSS</a></p>

      <div class="sys-status">
        <span class="sys-item">
          <span class="sys-dot"></span>
          SYS.STATUS: <span style="color: var(--green);">ONLINE</span>
        </span>
        <span class="sys-divider">|</span>
        <span class="sys-item">UPTIME: 99.9%</span>
        <span class="sys-divider">|</span>
        <span class="sys-item" id="sys-last-deploy">LAST DEPLOY: Cargando...</span>
      </div>
    </div>
  </footer>

  <button id="back-to-top" aria-label="Volver arriba">↑</button>

  <script src="ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('blog-container');
      const escapeHtml = (str) => window.PortfolioCounters ? window.PortfolioCounters.escapeHtml(str) : String(str);

      const statusMap = {
        active: { class: 'is-active', text: 'activo' },
        building: { class: 'is-building', text: 'en proceso' },
        planned: { class: 'is-planned', text: 'planeado' },
        inactive: { class: 'is-inactive', text: 'inactivo' }
      };

      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');

      if (!projectId) {
        container.innerHTML = `<div class="section"><h2 style="text-align:center;">Proyecto no encontrado</h2><p style="text-align:center; margin-top:20px;"><a href="proyectos.html" class="btn btn-primary">Volver a proyectos</a></p></div>`;
        return;
      }

      const safeGetLocal = (key) => {
        if (window.PortfolioCounters && window.PortfolioCounters.safeGetLocal) return window.PortfolioCounters.safeGetLocal(key);
        try { return localStorage.getItem(key); } catch { return null; }
      };
      const safeSetLocal = (key, val) => {
        if (window.PortfolioCounters && window.PortfolioCounters.safeSetLocal) return window.PortfolioCounters.safeSetLocal(key, val);
        try { localStorage.setItem(key, val); } catch {}
      };

      fetch(`projects.json?v=${Date.now()}`, { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(async projects => {
          const p = projects.find(proj => String(proj.id) === String(projectId));

          if (!p) {
            container.innerHTML = `<div class="section"><h2 style="text-align:center;">Proyecto no encontrado</h2><p style="text-align:center; margin-top:20px;"><a href="proyectos.html" class="btn btn-primary">Volver a proyectos</a></p></div>`;
            return;
          }

          document.title = `${p.title} · Nico Talens`;

          const projectImages = Array.isArray(p.images) ? p.images : (p.image ? [p.image] : []);
          const fitMode = p.imageFit === 'contain' ? 'contain' : 'cover';
          let imagesHTML = '';

          if (projectImages.length > 0) {
            projectImages.forEach((imgUrl, i) => {
              imagesHTML += `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(p.title || '')}" style="object-fit: ${fitMode};" class="${i === 0 ? 'active' : ''}" onerror="this.onerror=null;this.src='assets/img/placeholder.webp'">`;
            });
          }

          let markdownHTML = '';
          if (p.blog) {
            markdownHTML = window.marked ? marked.parse(p.blog) : `<p>${escapeHtml(p.blog)}</p>`;
          }

          const st = statusMap[p.status] || statusMap.inactive;
          const level = Number(p.level) || 1;
          let dotsLvl = '';
          for (let i = 1; i <= 5; i++) {
            dotsLvl += `<span class="lvl-dot ${i <= level ? 'is-on' : ''}"></span>`;
          }

          const hasLiked = safeGetLocal(`liked_${p.id}`) === 'true';
          const skillsHTML = Array.isArray(p.skills) && p.skills.length > 0
            ? `<div class="blog-skills-row">${p.skills.map(s => `<a href="proyectos.html?skill=${encodeURIComponent(s)}" class="blog-skill-chip">${escapeHtml(s)}</a>`).join('')}</div>`
            : '';

          const externalBtnHTML = p.link ? `
            <div style="margin-top: 32px; text-align: center;">
              <a href="${escapeHtml(p.link)}" target="_blank" rel="noopener" class="btn btn-primary" style="font-size: 15px; padding: 14px 28px;">
                Visitar el proyecto en vivo ↗
              </a>
            </div>
          ` : '';

          container.innerHTML = `
            <section class="section blog-header">
              <a href="proyectos.html" class="back-link">← Volver a proyectos</a>
              <h1 class="page-title">${escapeHtml(p.title)}</h1>
              <p class="page-subtitle">${escapeHtml(p.desc)}</p>

              <div class="blog-meta-bar">
                <span class="badge ${st.class}"><span class="badge-dot"></span>${st.text}</span>
                <div class="badge-level" title="Nivel: ${level}/5"><span class="badge-label">nivel</span>${dotsLvl}</div>
                <button type="button" class="blog-like-btn ${hasLiked ? 'is-liked' : ''}" id="detail-like-btn">
                  <span id="detail-like-icon">${hasLiked ? '❤️' : '🤍'}</span>
                  <span id="detail-like-count">...</span> likes
                </button>
              </div>
              ${skillsHTML}
            </section>

            ${projectImages.length > 0 ? `
              <section class="section" style="padding-top: 0;">
                <div class="blog-hero-carousel" id="blog-carousel">
                  ${imagesHTML}
                  ${projectImages.length > 1 ? `
                    <button type="button" class="blog-nav prev" aria-label="Imagen anterior" onclick="changeImg(-1)">❮</button>
                    <button type="button" class="blog-nav next" aria-label="Siguiente imagen" onclick="changeImg(1)">❯</button>
                  ` : ''}
                </div>
              </section>
            ` : ''}

            <section class="section blog-content-section">
              <div class="blog-markdown">
                ${markdownHTML || '<p><em>No hay contenido detallado para este proyecto todavía.</em></p>'}
              </div>
              ${externalBtnHTML}
            </section>
          `;

          // Cargar y sincronizar Likes del proyecto
          const likeBtn = document.getElementById('detail-like-btn');
          const likeCountEl = document.getElementById('detail-like-count');
          const likeIconEl = document.getElementById('detail-like-icon');

          try {
            const count = await window.PortfolioCounters.getProjectLikes(p.id);
            if (likeCountEl) likeCountEl.textContent = String(count ?? 0);
          } catch {
            if (likeCountEl) likeCountEl.textContent = '0';
          }

          if (likeBtn) {
            let pending = false;
            likeBtn.addEventListener('click', async () => {
              if (pending) return;
              pending = true;
              likeBtn.disabled = true;
              const currentlyLiked = safeGetLocal(`liked_${p.id}`) === 'true';
              const nextLiked = !currentlyLiked;
              try {
                const updated = await window.PortfolioCounters.setProjectLike(p.id, nextLiked);
                if (likeCountEl) likeCountEl.textContent = String(updated);
                if (likeIconEl) likeIconEl.textContent = nextLiked ? '❤️' : '🤍';
                likeBtn.classList.toggle('is-liked', nextLiked);
                safeSetLocal(`liked_${p.id}`, String(nextLiked));
              } catch {
                // Mantener estado previo
              } finally {
                likeBtn.disabled = false;
                pending = false;
              }
            });
          }

          // Carrusel en vista detalle + swipe táctil en móvil
          let currentImg = 0;
          const carouselEl = document.getElementById('blog-carousel');
          const imgs = document.querySelectorAll('#blog-carousel img');
          window.changeImg = (dir) => {
            if (imgs.length <= 1) return;
            imgs[currentImg].classList.remove('active');
            currentImg = (currentImg + dir + imgs.length) % imgs.length;
            imgs[currentImg].classList.add('active');
          };
          if (carouselEl && imgs.length > 1) {
            let startX = 0;
            let startY = 0;
            carouselEl.addEventListener('touchstart', (e) => {
              startX = e.touches[0].clientX;
              startY = e.touches[0].clientY;
            }, { passive: true });
            carouselEl.addEventListener('touchend', (e) => {
              const dx = e.changedTouches[0].clientX - startX;
              const dy = e.changedTouches[0].clientY - startY;
              if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
                window.changeImg(dx < 0 ? 1 : -1);
              }
            }, { passive: true });
          }
        })
        .catch(() => {
          container.innerHTML = `<p style="color: var(--accent); text-align:center; padding: clamp(48px, 12vw, 100px) 20px;">Error al cargar el proyecto.</p>`;
        });
    });
  </script>
</body>

</html>

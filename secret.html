<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Error</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon_oscuro.png">
  <meta name="robots" content="noindex, nofollow">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ff4d5e;
      font-family: monospace;
      overflow: hidden;
    }

    #jumpscare-video {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      display: block;
    }

    #fallback-screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px 18px;
      box-sizing: border-box;
      color: #c9d1d9;
    }

    #fallback-screen h1 {
      color: #ff4d5e;
      font-size: clamp(22px, 6vw, 32px);
      margin-bottom: 12px;
    }

    #fallback-screen p {
      font-size: clamp(13px, 3.8vw, 16px);
      max-width: 440px;
      line-height: 1.6;
    }

    #fallback-screen a {
      margin-top: 20px;
      color: #3ddc97;
      text-decoration: underline;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <video id="jumpscare-video" src="/assets/video/Original mp4.xawL3WXj.mp4.part" autoplay muted loop playsinline></video>
  <div id="fallback-screen">
    <h1>[!] Nice try, hacker.</h1>
    <p>Buen intento buscando SQLi / XSS / LFI en un portfolio estático.</p>
    <a href="/index.html">Volver al portfolio</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('jumpscare-video');
      const fallback = document.getElementById('fallback-screen');

      video.addEventListener('error', () => {
        video.style.display = 'none';
        fallback.style.display = 'flex';
      });

      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          setTimeout(() => {
            video.muted = false;
            video.volume = 1.0;
          }, 100);
        }).catch(() => {
          // Si falla la reproducción de un .part incompleto, mostramos el fallback
          video.style.display = 'none';
          fallback.style.display = 'flex';
        });
      }
    });
  </script>
</body>

</html>
